<title>Hario Switch Timer</title>
<style>
  :root{
    --bg: #1c1512;
    --panel: #241c17;
    --panel-edge: #33281f;
    --ink: #f3e9dc;
    --ink-muted: #b8a996;
    --accent: #c49a6c;
    --accent-dim: #96754a;
    --ready: #e4b363;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overscroll-behavior: none;
  }
  body{
    display:flex; flex-direction:column;
    min-height:100dvh;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }

  /* ---- progress ---- */
  .progress{
    display:flex; justify-content:center; gap:10px;
    margin-bottom: 28px;
  }
  .dot{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:600; font-variant-numeric: tabular-nums;
    border: 1.5px solid var(--panel-edge);
    color: var(--ink-muted);
    background: var(--panel);
    transition: all .35s ease;
  }
  .dot.done{ background: var(--accent-dim); border-color: var(--accent-dim); color: var(--bg); }
  .dot.active{ background: var(--accent); border-color: var(--accent); color: var(--bg); transform: scale(1.12); }

  /* ---- main card ---- */
  main{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    gap: 6px;
  }
  .step-label{
    font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    color: var(--ink-muted); font-weight:600;
  }
  .step-name{
    font-size:34px; font-weight:750; letter-spacing:-.02em;
    margin: 2px 0 18px;
  }

  .timer{
    font-variant-numeric: tabular-nums;
    font-size: 84px; font-weight:700; letter-spacing:-.03em;
    line-height:1;
    margin: 6px 0 10px;
    transition: color .3s ease, filter .15s ease;
    filter: brightness(1);
  }
  .timer.flash{ filter: brightness(1.9); }
  .timer.ready{ color: var(--ready); }
  .timer.static{ font-size:56px; color: var(--ink-muted); }

  .amount{
    font-size:19px; color: var(--ink); font-weight:500;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    padding: 10px 20px;
    border-radius: 14px;
    margin-top: 6px;
  }
  .amount b{ color: var(--accent); font-weight:700; }

  .oval-row{
    display:flex; flex-wrap:wrap; justify-content:center; gap:10px;
    margin-top: 6px;
  }
  .oval{
    font-size:17px; color: var(--ink); font-weight:500;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    padding: 10px 18px;
    border-radius: 999px;
  }

  .instructions{
    color: var(--ink-muted); font-size:15px; margin-top:14px; max-width:280px;
    line-height:1.4;
  }

  /* ---- next button ---- */
  .next-btn{
    width:100%; max-width:420px;
    padding: 18px;
    font-size:18px; font-weight:700;
    border-radius:16px;
    border: none;
    background: var(--panel);
    color: var(--ink-muted);
    border: 1.5px solid var(--panel-edge);
    margin-top: 26px;
    transition: all .3s ease;
  }
  .next-btn.ready{
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .next-btn:active.ready{ transform: scale(.97); }
  .next-btn:disabled{ opacity:.55; }

  /* Disable all transitions momentarily during rotation/resize to prevent
     visual jitter as the layout reflows on iOS. */
  html.no-transitions *{
    transition: none !important;
    animation: none !important;
  }

  .reset-link{
    margin-top:16px; background:none; border:none;
    color: var(--ink-muted); font-size:13px; text-decoration:underline;
    padding:8px;
  }

  .wake-note{
    font-size:11px; color: var(--ink-muted); opacity:.6; margin-top:10px; min-height:14px;
    text-align:center;
  }
</style>
</head>
<body>

<div class="progress" id="progress"></div>

<main id="main"></main>

function fmt(sec){
  const m = Math.floor(sec/60);
  const s = sec%60;
  return m + ":" + String(s).padStart(2,'0');
}

function renderProgress(){
  progressEl.innerHTML = steps.map((s,i)=>{
    let cls = 'dot';
    if(i < current) cls += ' done';
    else if(i === current) cls += ' active';
    return `<div class="${cls}">${i+1}</div>`;
  }).join('');
}

/* Keep a near-silent oscillator running for the entire session once
   unlocked. On iOS, standalone home-screen apps can silently revoke
   audio permission after a period of inactivity (e.g. during a 3-minute
   brew timer) even after an earlier user-gesture unlock. Keeping the
   AudioContext continuously "busy" prevents that from happening. */
function startKeepAlive(){
  if(keepAliveStarted) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    gain.gain.value = 0.00001; // effectively silent, but non-zero
    osc.frequency.value = 20;
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    keepAliveStarted = true;
  }catch(e){ /* audio unavailable, ignore */ }
}

function playToneBeep(count){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    const now = audioCtx.currentTime;
    for(let i=0;i<count;i++){
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now + i*0.35);
      gain.gain.linearRampToValueAtTime(0.9, now + i*0.35 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.35 + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + i*0.35);
      osc.stop(now + i*0.35 + 0.32);
    }
  }catch(e){ /* audio unavailable, ignore */ }
}

function playFileBeep(count){
  count = count || 3;
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      try{
        beepAudio.pause();
        beepAudio.currentTime = 0;
        const p = beepAudio.play();
        if(p && p.catch) p.catch(()=>{ /* playback blocked, ignore */ });
      }catch(e){ /* audio unavailable, ignore */ }
    }, i*350);
  }
}

function beep(count){
  count = count || 3;
  // Fire both playback paths; whichever iOS actually permits will be heard.
  playToneBeep(count);
  playFileBeep(count);
}

function vibrate(){
  if(navigator.vibrate){ navigator.vibrate([200,80,200]); }
}

function flashTimer(count){
  count = count || 3;
  const disp = document.getElementById('timerDisplay');
  if(!disp) return;
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      disp.classList.add('flash');
      setTimeout(()=>disp.classList.remove('flash'), 180);
    }, i*350);
  }
}


function clearTimerHandle(){
  if(timerHandle){ clearInterval(timerHandle); timerHandle = null; }
}

function renderStep(){
  clearTimerHandle();
  ready = false;
  renderProgress();

  const step = steps[current];
  const hasTimer = step.duration > 0;
  const isLast = current === steps.length - 1;
  remaining = step.duration;

  mainEl.innerHTML = `
    <div class="step-label">Step ${current+1} of ${steps.length}</div>
    <div class="step-name">${step.name}</div>
    ${hasTimer ? `<div class="timer" id="timerDisplay">${fmt(remaining)}</div>` : ''}
    ${step.amountLabels ? `<div class="oval-row">${step.amountLabels.map(a => `<div class="oval">${a}</div>`).join('')}</div>` : ''}
    ${step.amountLabel ? `<div class="amount">${step.amountLabel}</div>` : ''}
    ${step.instructions ? `<div class="instructions">${step.instructions}</div>` : ''}
    <button class="next-btn ready" id="nextBtn">
      ${hasTimer ? 'Start' : (step.nextLabel || 'Next Step')}
    </button>
    ${current === 0 ? '' : '<button class="reset-link" id="resetBtn">Restart</button>'}
  `;

  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn) resetBtn.onclick = resetAll;
  const nextBtn = document.getElementById('nextBtn');

  if(!hasTimer){
    nextBtn.onclick = advance;
  } else if(step.autoStart){
    startTimer();
  } else {
    nextBtn.onclick = startTimer;
  }
}

function unlockAudio(){
  startKeepAlive();
  try{
    // Play + immediately pause the base element within this tap to unlock
    // audio playback on iOS for the rest of the session.
    beepAudio.volume = 1.0;
    const p = beepAudio.play();
    if(p && p.then){
      p.then(()=>{
        beepAudio.pause();
        beepAudio.currentTime = 0;
        audioUnlocked = true;
      }).catch(()=>{ /* playback blocked, ignore */ });
    } else {
      beepAudio.pause();
      beepAudio.currentTime = 0;
      audioUnlocked = true;
    }
  }catch(e){ /* audio unavailable, ignore */ }
}

function startTimer(){
  unlockAudio();
  const step = steps[current];
  const btn = document.getElementById('nextBtn');
  if(btn){
    btn.textContent = step.waitingLabel || 'Waiting…';
    btn.disabled = true;
    btn.onclick = null;
  }
  timerHandle = setInterval(()=>{
    remaining--;
    const disp = document.getElementById('timerDisplay');
    if(remaining >= 0 && disp) disp.textContent = fmt(remaining);
    if(remaining <= 0){
      clearTimerHandle();
      markReady();
    }
  }, 1000);
}

function markReady(){
  ready = true;
  const step = steps[current];
  const isLast = current === steps.length - 1;
  const count = step.beepCount || 3;
  beep(count);
  vibrate();
  flashTimer(count);
  const disp = document.getElementById('timerDisplay');
  const btn = document.getElementById('nextBtn');
  if(disp) disp.classList.add('ready');
  if(btn){
    btn.textContent = step.doneLabel || (isLast ? 'Done!' : 'Next Step');
    btn.classList.add('ready');
    btn.disabled = false;
    btn.onclick = isLast ? resetAll : advance;
  }
}

function advance(){
  current++;
  renderStep();
}

function resetAll(){
  current = 0;
  releaseWakeLock();
  renderStep();
  requestWakeLock();
}

/* ---- Screen Wake Lock ---- */
async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeNoteEl.textContent = '';
      wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
    }
  }catch(e){
    wakeNoteEl.textContent = 'Tip: keep this tab open — screen may auto-lock.';
  }
}
function releaseWakeLock(){
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
}
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState === 'visible' && !wakeLock){
    requestWakeLock();
  }
});

/* Prevent visual jitter during device rotation by briefly disabling all
   CSS transitions/animations while the layout is reflowing. */
let orientationSettleTimer = null;
function freezeTransitionsDuringResize(){
  document.documentElement.classList.add('no-transitions');
  clearTimeout(orientationSettleTimer);
  orientationSettleTimer = setTimeout(()=>{
    document.documentElement.classList.remove('no-transitions');
  }, 400);
}
window.addEventListener('orientationchange', freezeTransitionsDuringResize);
window.addEventListener('resize', freezeTransitionsDuringResize);

/* Safety net: unlock audio on the very first tap anywhere on the page,
   not just the Start button, in case the app is opened and audio needs
   to be ready sooner. */
function firstTapUnlock(){
  unlockAudio();
  document.removeEventListener('touchstart', firstTapUnlock);
  document.removeEventListener('pointerdown', firstTapUnlock);
}
document.addEventListener('touchstart', firstTapUnlock, { once: true });
document.addEventListener('pointerdown', firstTapUnlock, { once: true });

/* init */
renderStep();
requestWakeLock();
</script>
</body>
</html>
